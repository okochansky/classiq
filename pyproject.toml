[project]
name = "classiq-take-home"
version = "0.1.0"
description = "Async API for executing QASM3 quantum circuits on Qiskit AerSimulator."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "redis>=5.0,<6.0",
  "qiskit>=1.2,<2.0",
  "qiskit-aer>=0.15,<0.16",
  "structlog>=24.4,<25.0",
  "prometheus-client>=0.20,<0.21",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<0.25",
  "fakeredis>=2.25,<3.0",
  "httpx>=0.27,<0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
