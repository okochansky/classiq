services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build: .
    command: ["python", "-m", "app.worker.main"]
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://redis:6379/0"
      # WORKER_ID is intentionally NOT set: app.worker.main falls back to
      # `worker-${HOSTNAME}` so `docker compose up -d --scale worker=N`
      # gives each replica a distinct consumer name.
      METRICS_PORT: "8001"
    expose:
      - "8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/metrics"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Generous grace so an in-flight simulation finishes & XACKs before SIGKILL.
    # Anything still running past this lands in PEL; the sweeper recovers it.
    stop_grace_period: 60s

  sweeper:
    build: .
    command: ["python", "-m", "app.sweeper.main"]
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://redis:6379/0"
      # SWEEPER_ID intentionally unset — defaults to `sweeper-${HOSTNAME}`,
      # so `--scale sweeper=N` gives each replica a distinct identity.
      # Demo-friendly defaults; production tuning would raise idle (e.g. 120000)
      # and interval (e.g. 15) so transient pauses don't trigger reclaim storms.
      SWEEPER_IDLE_MS: "10000"
      SWEEPER_INTERVAL_S: "2"
      METRICS_PORT: "8001"
    expose:
      - "8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/metrics"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker
      - sweeper

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  redis-data:
